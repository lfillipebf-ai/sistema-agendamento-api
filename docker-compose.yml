services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scheduling
      POSTGRES_USER: scheduling
      POSTGRES_PASSWORD: scheduling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scheduling
      DB_USER: scheduling
      DB_PASSWORD: scheduling
    ports:
      - "8080:8080"
volumes:
  postgres_data:
